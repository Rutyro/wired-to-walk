[workspace]
resolver = "3"
members = [
    "crates/connectome",
    "crates/policy",
    "crates/sim",
    "crates/train",
]
default-members = [
    "crates/connectome",
    "crates/policy",
    "crates/sim",
    "crates/train",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Rutyro/wired-to-walk"
rust-version = "1.95"

[workspace.dependencies]
arrow = { version = "60.0.0", default-features = false, features = ["ipc_compression"] }
bincode = { version = "2.0.1", features = ["serde"] }
burn = { version = "0.22.0", default-features = false, features = ["autodiff", "cuda", "flex", "optim", "std"] }
mujoco-rs = { version = "6.1.0", features = ["auto-download-mujoco"] }
rand = "0.9.2"
rand_chacha = "0.9.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
